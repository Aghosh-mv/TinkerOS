# TinkerOS System Configuration
# Main system settings file

[system]
hostname = TinkerOS
version = 1.0
codename = "First Light"
kernel = 7.2.0-tinker

[boot]
splash = true
quiet = true
timeout = 5
default_kernel = latest

[display]
 compositor = wayland
session = tinker
vsync = true
hdr = auto
fractional_scaling = true

[audio]
backend = pipewire
latency = low
effects = true

[network]
backend = NetworkManager
firewall = true
dns = securedns

[security]
auto_updates = true
firewall = true
sandboxing = flatpak
secure_boot = auto

[performance]
governor = schedutil
turbo = auto
power_save = auto

[accessibility]
screen_reader = false
high_contrast = false
large_text = false
slow_keys = false
sticky_keys = false

[smart_features]
accent_picker = true
autocorrect = true
clipboard_history = true
emoji_picker = true
night_light = true
focus_mode = true
smart_quotes = true
unit_converter = true
timestamp_converter = true

[gaming]
steam = true
proton = true
gamemode = true
controller = true

[updates]
channel = stable
auto_check = true
auto_download = false
auto_install = false
