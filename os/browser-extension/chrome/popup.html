<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TinkerOS Password Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 350px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1b26;
            color: #c0caf5;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #3b4261;
        }
        .header h1 {
            font-size: 18px;
            color: #7aa2f7;
        }
        .header span {
            font-size: 24px;
            margin-right: 10px;
        }
        .privacy-note {
            background: #24283b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #9ece6a;
            text-align: center;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-primary {
            background: #7aa2f7;
            color: #1a1b26;
        }
        .btn-secondary {
            background: #3b4261;
            color: #c0caf5;
        }
        .btn-danger {
            background: #f7768e;
            color: #1a1b26;
        }
        .saved-passwords {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        .saved-item {
            background: #24283b;
            padding: 10px;
            border-radius: 6px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .saved-item .site {
            font-weight: 500;
        }
        .saved-item .copy-btn {
            background: #7aa2f7;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            color: #1a1b26;
            font-size: 12px;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            background: #24283b;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
        }
        .status.success {
            color: #9ece6a;
        }
        .status.error {
            color: #f7768e;
        }
    </style>
</head>
<body>
    <div class="header">
        <span>🔐</span>
        <h1>TinkerOS Password Manager</h1>
    </div>
    
    <div class="privacy-note">
        ✓ Your data stays on YOUR device<br>
        ✓ No cloud storage<br>
        ✓ 100% local encryption
    </div>
    
    <button class="btn btn-primary" id="generate">Generate Strong Password</button>
    <button class="btn btn-secondary" id="useExisting">Use Saved Password</button>
    <button class="btn btn-secondary" id="viewSaved">View Saved Passwords</button>
    <button class="btn btn-danger" id="clearAll">Clear All Data</button>
    
    <div id="savedList" class="saved-passwords" style="display: none;"></div>
    
    <div id="status" class="status"></div>
    
    <script src="popup.js"></script>
</body>
</html>
