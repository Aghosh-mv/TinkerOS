<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KorrinOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff;

background:#80b9f0;
background:
 radial-gradient(1200px 700px at 75% 30%, rgba(147,197,253,.5), transparent 60%),
 radial-gradient(900px 600px at 20% 85%, rgba(191,219,254,.4), transparent 55%),
 linear-gradient(180deg,#9dc8f4,#b9d7f6 55%,#dbe8f7);
}
.glass{background:rgba(255,255,255,.12);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 40px rgba(31,60,110,.14)}

/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;left:88px;right:0;height:48px;display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 20px;z-index:20;font-size:12px;color:rgba(255,255,255,.92)}
#topbar .chip{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14)}
#topbar .chip .dot{width:7px;height:7px;border-radius:50%;background:#63e6a8}
#userChip{font-weight:600}

/* ---------- sidebar rail ---------- */
#rail{position:fixed;left:0;top:0;height:100vh;width:88px;display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:6px;z-index:30}
#rail .logo{font-size:20px;font-weight:800;letter-spacing:-1px;margin-bottom:14px;opacity:.9;color:#fff;text-shadow:0 2px 10px rgba(31,60,110,.25)}
.rail-item{width:54px;height:54px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:rgba(255,255,255,.75);transition:all .18s;user-select:none}
.rail-item:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.rail-item.active{background:rgba(255,255,255,.2);color:#fff}
.rail-item .gi{width:22px;height:22px}
.rail-item .nm{font-size:9px;opacity:.7}
#rail .spacer{flex:1}

/* world switcher at bottom of rail */
.world-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:3px 0;cursor:pointer;font-weight:700;font-size:11px;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);transition:all .18s;user-select:none}
.world-btn.active{background:#fff;color:#3b6db3;border-color:transparent;box-shadow:0 6px 20px rgba(31,60,110,.25);transform:scale(1.06)}
.world-btn.opt{background:rgba(255,255,255,.12)}
.world-btn.opt:hover{background:rgba(255,255,255,.28)}

/* ---------- main ---------- */
#main{position:fixed;left:88px;top:48px;right:0;bottom:0;padding:34px 40px 28px;display:grid;grid-template-columns:1fr 300px;grid-template-rows:auto auto 1fr auto;gap:18px}
#greet{grid-column:1;grid-row:1}
#greet h1{font-size:34px;font-weight:300;letter-spacing:-.5px;text-shadow:0 2px 14px rgba(31,60,110,.2)}
#greet .sub{font-size:13px;opacity:.65;margin-top:2px}
#wsearch{grid-column:1;grid-row:2;margin-top:6px}
#wsearch .box{display:flex;align-items:center;gap:12px;width:min(560px,90%);padding:13px 18px;border-radius:16px}
#wsearch input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:15px}
#wsearch input::placeholder{color:rgba(255,255,255,.55)}
#wsearch .kbd{font-size:11px;opacity:.45;border:1px solid rgba(255,255,255,.2);padding:2px 7px;border-radius:6px}
#apps{grid-column:1;grid-row:3;align-self:start;margin-top:10px}
#apps .ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#apps .ah .t{font-size:14px;font-weight:600}
#apps .ah .a{font-size:11px;opacity:.55;cursor:pointer}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;max-width:720px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:18px;cursor:pointer;transition:all .15s;user-select:none}
.app:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.app .ai{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);color:rgba(255,255,255,.9)}
.app .an{font-size:10px;opacity:.8}
.icon-svg{width:22px;height:22px}

#widgets{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.card{padding:16px 18px;border-radius:20px}
.card .ct{font-size:12px;font-weight:600;opacity:.75;margin-bottom:8px;display:flex;justify-content:space-between}
.card .ct .more{opacity:.4;font-size:11px}
#clock .t{font-size:36px;font-weight:200;letter-spacing:-1px;line-height:1}
#clock .d{font-size:12px;opacity:.6;margin-top:4px}
#wdata .row{display:flex;align-items:center;gap:10px}
#wdata .tmp{font-size:30px;font-weight:200}
#wdata .desc{font-size:12px;opacity:.65;margin-top:2px}
#todo li{list-style:none;display:flex;gap:10px;align-items:flex-start;font-size:12.5px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07)}
#todo li:last-child{border:0}
#todo input{accent-color:#fff;margin-top:2px}

#bottom{grid-column:1;grid-row:4;display:flex;gap:18px;align-items:stretch}
.panel{flex:1;padding:16px 18px;border-radius:20px}
.panel .pt{font-size:12px;font-weight:600;opacity:.75;margin-bottom:10px;display:flex;justify-content:space-between}
.panel .pt .more{opacity:.4;font-size:11px;cursor:pointer}
#recent .row{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.06)}
#recent .row:last-child{border:0}
#recent .rname{flex:1}
#recent .rmt{opacity:.4;font-size:11px}
#worldpanel .wrow{display:flex;gap:10px}
#worldpanel .wcell{flex:1;padding:12px;border-radius:14px;text-align:center;cursor:pointer;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);transition:all .15s}
#worldpanel .wcell:hover{background:rgba(255,255,255,.2)}
#worldpanel .wcell.active{background:#fff;color:#3b6db3;border-color:transparent}
#worldpanel .wcell .wt{font-weight:700;font-size:13px}
#worldpanel .wcell .wd{font-size:10px;opacity:.6;margin-top:2px}
#worldpanel .wcell.active .wd{opacity:.7}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);padding:12px 22px;border-radius:14px;font-size:13px;opacity:0;transition:all .25s;z-index:99;background:rgba(20,35,60,.62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="topbar">
  <div class="chip"><span class="dot"></span><span id="worldTop">Work</span></div>
  <div class="chip"><span id="battery">--</span></div>
  <div class="chip"><span id="clockTop">--:--</span></div>
  <div class="chip" id="userChip">--</div>
</div>

<div id="rail" class="glass">
  <div class="logo">K</div>
  <div class="rail-item active" data-act="home"><div class="gi ic-home"></div><div class="nm">Home</div></div>
  <div class="rail-item" data-launch="files"><div class="gi ic-folder"></div><div class="nm">Files</div></div>
  <div class="rail-item" data-launch="browser"><div class="gi ic-globe"></div><div class="nm">Web</div></div>
  <div class="rail-item" data-launch="vokk"><div class="gi ic-spark"></div><div class="nm">VOKK</div></div>
  <div class="rail-item" data-launch="settings"><div class="gi ic-gear"></div><div class="nm">Settings</div></div>
  <div class="rail-item" data-launch="store"><div class="gi ic-bag"></div><div class="nm">Store</div></div>
  <div class="spacer"></div>
  <div id="worldSwitch"></div>
</div>

<div id="main">
  <div id="greet">
    <h1 id="greetH">Good evening.</h1>
    <div class="sub" id="greetS">Let's build something.</div>
  </div>
  <div id="wsearch">
    <div class="box glass">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Ask VOKK or open an app..." autocomplete="off">
      <span class="kbd" id="worldKbd">NORMAL</span>
    </div>
  </div>
  <div id="apps">
    <div class="ah"><span class="t">Your world</span><span class="a" id="allApps">All apps</span></div>
    <div id="grid"></div>
  </div>
  <div id="widgets">
    <div class="card glass" id="clock">
      <div class="ct"><span>Clock</span></div>
      <div class="t">--:--</div>
      <div class="d">--</div>
    </div>
    <div class="card glass" id="wdata">
      <div class="ct"><span>Weather</span><span class="more" id="wLoc">--</span></div>
      <div class="row"><span class="tmp">--°</span></div>
      <div class="desc">--</div>
    </div>
    <div class="card glass" id="todoCard">
      <div class="ct"><span>Focus tasks</span><span class="more">edit</span></div>
      <ul id="todo"><li style="opacity:.5">Loading...</li></ul>
    </div>
  </div>
  <div id="bottom">
    <div class="panel glass" id="recent">
      <div class="pt"><span>Continue where you left off</span><span class="more">open</span></div>
      <div class="rep" id="recentL"></div>
    </div>
    <div class="panel glass" id="worldpanel">
      <div class="pt"><span>Switch world</span><span class="more" id="worldHint">1/2/3</span></div>
      <div class="wrow" id="worldCells"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const APPS={vokk:{nm:'VOKK',c:'#6C9CFC'},browser:{nm:'Browser',c:'#58a6ff'},chat:{nm:'Chat',c:'#805ad5'},code:{nm:'Code',c:'#2f9e6b'},files:{nm:'Files',c:'#e5a72f'},music:{nm:'Music',c:'#e06c9f'},video:{nm:'Video',c:'#d05656'},photos:{nm:'Photos',c:'#56a8d0'},settings:{nm:'Settings',c:'#9aa5b1'},store:{nm:'Store',c:'#6fcf97'},games:{nm:'Games',c:'#b07ff0'},more:{nm:'More',c:'#8892a8'}};
const WLABEL={NORMAL:'Work',HACK:'Hackers',GAME:'Play'};

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
async function api(path,opt){const r=await fetch(path,opt);return r.json()}
function launch(app){toast('Opening '+ (APPS[app]?APPS[app].nm:app));api('/api/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app})})}

function geom(name){const p={folder:'M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z',globe:'M12 21a9 9 0 100-18 9 9 0 000 18zm0 0c2.5-2.5 2.5-6.5 0-9-2.5 2.5-2.5 6.5 0 9zM3 12h18',spark:'M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7z',gear:'M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-2.7-1.1l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00-1.1-2.7H3a2 2 0 110-4h.1a1.6 1.6 0 001.1-2.7L4.1 9a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 009.6 8V8a2 2 0 114 0v.1a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8z',bag:'M6 7V6a6 6 0 1112 0v1h2a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1h2zm2 0h8V6a4 4 0 10-8 0V7z',home:'M3 11l9-8 9 8h-2v9a1 1 0 01-1 1h-5v-6h-2v6H6a1 1 0 01-1-1v-9H3z'};
return '<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+(p[name]||p.home)+'"/></svg>'}

function fillGrid(apps){
  let active=apps||Object.keys(APPS);const g=document.getElementById('grid');g.innerHTML='';
  active.forEach(k=>{const a=APPS[k];if(!a)return;const d=document.createElement('div');d.className='app';
    d.innerHTML='<div class="ai" style="background:linear-gradient(135deg,'+a.c+'55,'+a.c+'22);border:1px solid '+(a.c||'#888')+'44">'+geom(k==='applications'?'folder':k)+'</div><div class="an">'+a.nm+'</div>';
    d.onclick=()=>launch(k);g.appendChild(d)});
}

function renderWorlds(w){
  const sw=document.getElementById('worldSwitch');sw.innerHTML='';
  document.getElementById('worldKbd').textContent=w.current;
  document.getElementById('worldTop').textContent=(WLABEL[w.current]||w.current);
  document.getElementById('worldCells').innerHTML='';
  w.worlds.forEach(name=>{
    const b=document.createElement('div');b.className='world-btn'+(name===w.current?' active':' opt');b.textContent=name[0]+(name[0]==='N'?'':'')+name.slice(1).slice(0,1);b.title=WLABEL[name];
    b.onclick=()=>switchWorld(name);sw.appendChild(b);
    const c=document.createElement('div');c.className='wcell'+(name===w.current?' active':'');c.innerHTML='<div class="wt">'+name+'</div><div class="wd">'+(WLABEL[name]||'')+'</div>';
    c.onclick=()=>switchWorld(name);document.getElementById('worldCells').appendChild(c);
  });
}

async function switchWorld(name){
  const r=await api('/api/world',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({world:name})});
  toast(r.result||'switched');
  const st=await api('/api/state');renderWorlds(st.world);paintGreet();
}

async function paintGreet(){
  const st=await api('/api/state');
  document.getElementById('userChip').textContent=st.user;
  document.getElementById('battery').textContent=(st.battery==='desktop'?'Desktop':'Battery '+st.battery+'%');
  const h=new Date().getHours();const tw=h>=5&&h<12?'morning':h>=12&&h<17?'afternoon':h>=21||h<5?'night':'evening';
  document.getElementById('greetH').textContent='Good '+tw+', '+st.user+'.';
  const wl=WLABEL[st.world.current]||'';
  document.getElementById('greetS').textContent=(wl?wl+' world. ':'')+'Ready for what is next?';
}

async function paintWeather(){
  const st=await api('/api/state');
  document.getElementById('clockTop').textContent=st.time;
  document.getElementById('clock').querySelector('.t').textContent=st.time;
  document.getElementById('clock').querySelector('.d').textContent=st.date;
  try{const w=JSON.parse(st.weather||'{}');if(w.current_condition){
    const c=w.current_condition[0];document.getElementById('wLoc').textContent=(w.nearest_area&&w.nearest_area[0].areaName[0].value)||'--';
    document.querySelector('#wdata .tmp').textContent=c.temp_C+'°';
    document.querySelector('#wdata .desc').textContent=(c.weatherDesc[0].value||'')+'  ·  H '+(w.weather[0].maxtempC)+'° L '+(w.weather[0].mintempC)+'°';}
   else document.querySelector('#wdata .desc').textContent='offline';}catch(e){document.querySelector('#wdata .desc').textContent='--'}
}

async function paintRecent(){
  const r=await api('/api/recent');const el=document.getElementById('recentL');el.innerHTML='';
  if(!r.length){el.innerHTML='<div class="row" style="opacity:.5">Nothing recent yet</div>';return}
  r.slice(0,5).forEach(f=>{const d=document.createElement('div');d.className='row';d.innerHTML='<span style="opacity:.5">&#9679;</span><span class="rname">'+esc(f.name)+'</span><span class="rmt">'+esc(f.mtime.slice(0,16).replace('T',' '))+'</span>';el.appendChild(d)});
}
async function paintTodo(){
  const r=await api('/api/tasks');const el=document.getElementById('todo');el.innerHTML='';
  if(!r.length){el.innerHTML='<li style="opacity:.5">No tasks</li>';return}
  r.slice(0,4).forEach(t=>{const li=document.createElement('li');li.innerHTML='<input type="checkbox"><span>'+esc(t.text)+'</span>';el.appendChild(li)});
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){launch('vokk');toast('Say it to VOKK v4');e.target.value=''}});
document.querySelectorAll('.rail-item').forEach(it=>{
  it.onclick=()=>{document.querySelectorAll('.rail-item').forEach(x=>x.classList.remove('active'));it.classList.add('active');
    if(it.dataset.launch)launch(it.dataset.launch);else fillGrid()}});
document.addEventListener('keydown',e=>{
  if(e.shiftKey&&e.code.startsWith('Digit')){const m={'Digit1':'HACK','Digit2':'NORMAL','Digit3':'GAME'}[e.code];if(m)switchWorld(m)}});

function tick(){
  if(!document.hidden){paintGreet();paintWeather();}
  const c=document.getElementById('clock');const now=new Date();
  c.querySelector('.t').textContent=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  c.querySelector('.d').textContent=now.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('clockTop').textContent=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

(async function init(){
  const st=await api('/api/state');
  renderWorlds(st.world);fillGrid();paintGreet();paintWeather();paintRecent();paintTodo();
  setInterval(tick,1000);
})();
</script>
</body>
</html>
