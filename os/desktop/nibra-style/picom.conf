# KorrinOS Desktop — Picom Config (Frosted Glass)
# dual_kawase blur for glassmorphism panels
# Smooth, atmospheric, distinctly KorrinOS.

backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
vsync = true;
sw-opti = true;

# --- Blur (frosted glass) ---
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-kernel = "11x11gaussian";

# --- Opacity ---
active-opacity = 0.92;
inactive-opacity = 0.82;
frame-opacity = 0.88;
inactive-opacity-override = false;

opacity-rule = [
    "100:class_g = 'firefox' && focused",
    "100:class_g = 'Thunar' && focused",
    "100:class_g = 'Code' && focused",
    "100:class_g = 'Gimp' && focused",
    "100:class_g = 'Inkscape' && focused",
    "95:class_g = 'xfce4-panel' && focused",
    "95:class_g = 'XFCE' && focused",
    "90:class_g = 'korrinos-dock' && focused",
    "90:class_g = 'korrinos-sidebar' && focused",
    "85:class_g = 'korrinos-widget' && focused",
    "95:fullscreen"
];

# --- Rounded corners ---
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "class_g = 'xfce4-panel' && _NET_WM_STATE@[*] = '_NET_WM_STATE_ABOVE'",
    "_NET_WM_STATE@[*]:32a = '_NET_WM_STATE_FULLSCREEN'"
];

# --- Shadows ---
shadow = true;
shadow-radius = 12;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.4;

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'xfce4-panel'",
    "class_g = 'korrinos-dock'",
    "_NET_WM_STATE@[*]:32a = '_NET_WM_STATE_FULLSCREEN'"
];

# --- Fading ---
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# --- Window type defaults ---
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.9; };
    dock = { shadow = false; clip-shadow-above = true; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.92; blur-background = true; };
    dropdown_menu = { opacity = 0.92; blur-background = true; };
};
