# KorrinOS Boot Configuration
# GRUB2 configuration for KorrinOS

# Default boot entry
DEFAULT=0
TIMEOUT=5
HIDDEN_TIMEOUT=0

# Menu colors
COLOR_NORMAL=white/black
COLOR_HIGHLIGHT=black/light-gray

# Boot menu entries
menuentry "KorrinOS" {
    set root='hd0,gpt2'
    linux /boot/vmlinuz root=/dev/sda2 ro quiet splash
    initrd /boot/initrd.img
}

menuentry "KorrinOS (Recovery)" {
    set root='hd0,gpt2'
    linux /boot/vmlinuz root=/dev/sda2 ro single
    initrd /boot/initrd.img
}

menuentry "KorrinOS (Safe Mode)" {
    set root='hd0,gpt2'
    linux /boot/vmlinuz root=/dev/sda2 ro nomodeset
    initrd /boot/initrd.img
}

menuentry "Memory Test (memtest86+)" {
    linux /boot/memtest86+.bin
}
