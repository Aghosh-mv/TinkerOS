# TinkerOS User Profile Templates
# Pre-configured profiles for different user types

# ============================================
# DEVELOPER PROFILE
# ============================================
[profile-developer]
name="Developer"
description="Software development workstation"
icon="💻"

# Essential dev tools
packages=(
    "build-essential:Build tools"
    "git:Version control"
    "python3:Python"
    "python3-pip:Python packages"
    "python3-venv:Python venv"
    "nodejs:Node.js"
    "npm:Node packages"
    "yarn:Yarn packages"
    "golang:Go language"
    "rustc:Rust compiler"
    "cargo:Rust packages"
    "java-17-openjdk:Java JDK"
    "docker:Docker"
    "docker-compose:Docker Compose"
    "kubectl:Kubernetes CLI"
    "terraform:IaC"
    "ansible:Automation"
    "vim:Text editor"
    "neovim:Modern vim"
    "tmux:Terminal multiplexer"
    "curl:HTTP client"
    "wget:Download tool"
    "jq:JSON processor"
    "htop:Process monitor"
)

# VS Code extensions
vscode_extensions=(
    "ms-python.python:Python"
    "ms-vscode.cpptools:C/C++"
    "rust-lang.rust-analyzer:Rust"
    "golang.go:Go"
    "dbaeumer.vscode-eslint:ESLint"
    "esbenp.prettier-vscode:Prettier"
    "ms-azuretools.vscode-docker:Docker"
    "kubernetes.kubernetes:Kubernetes"
)

# Git configuration
git_config=(
    "user.name=Your Name"
    "user.email=you@example.com"
    "init.defaultBranch=main"
    "core.editor=vim"
    "pull.rebase=true"
    "push.autoSetupRemote=true"
)

# Terminal config
terminal_config=(
    "font=Fira Code"
    "font_size=12"
    "theme=tokyo-night"
    "shell=/bin/zsh"
)

